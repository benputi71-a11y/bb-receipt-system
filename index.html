<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174a8b">

<title>民宿電子收據系統｜沐光民宿二館</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fa;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
}

header{
  background:#174a8b;
  color:white;
  padding:20px;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

h1{
  font-size:24px;
  margin:0 0 6px;
}

header p{
  margin:0;
  opacity:.9;
}

main{
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #0001;
}

h2{
  font-size:19px;
  margin:0 0 15px;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  font-weight:700;
  font-size:14px;
}

input{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#174a8b;
  color:#fff;
}

.secondary{
  background:#e8eef6;
  color:#174a8b;
}

.preview-wrap{
  overflow:auto;
  background:#e9edf2;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

canvas{
  max-width:100%;
  height:auto;
  background:white;
  box-shadow:0 2px 8px #0002;
}

.note{
  background:#f7f9fc;
  border-left:4px solid #174a8b;
  padding:12px;
  line-height:1.65;
  font-size:14px;
}

@media(max-width:650px){

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>

</head>


<body>

<header>

<div class="wrap">

<h1>🏠 民宿電子收據系統</h1>

<p>第一個可填寫版本｜沐光民宿二館</p>

</div>

</header>


<main class="wrap">


<section class="card">

<h2>① 輸入收據資料</h2>

<div class="form">


<label>
入住日期
<input id="date" type="date" value="2024-12-12">
</label>


<label>
住宿天數
<input id="nights" type="number" min="1" value="1">
</label>


<label>
單價
<input id="price" type="number" min="0" value="2000">
</label>


<label>
抬頭
<input id="title" value="臺灣高等法院">
</label>


<label>
統一編號
<input id="tax" value="03796404">
</label>


<label>
訂單編號
<input id="order" value="0afb 867-2">
</label>


<label>
地址
<input id="address" value="">
</label>


<label class="full">
品名摘要
<input id="item" value="沐光 住宿公務保留房費">
</label>


</div>


<div class="actions">

<button class="primary" onclick="makeReceipt()">
產生預覽
</button>

<button class="secondary" onclick="resetForm()">
恢復測試資料
</button>

</div>

</section>



<section class="card">

<h2>② 收據預覽</h2>

<div class="note">

輸入資料會直接套用到原始收據版型。<br>
不會再把輸入欄位的背景色合成到收據裡。

</div>

<br>

<div class="preview-wrap">

<canvas id="receipt"></canvas>

</div>

<div class="actions">

<button class="primary" onclick="downloadJpg()">
下載 JPG（測試版）
</button>

</div>

</section>


</main>



<script>


/* =========================================================
   原始收據圖片
========================================================= */

const img = new Image();

img.src = "receipt-template-m2.png";


const $ = id => document.getElementById(id);



/* =========================================================
   民國日期
========================================================= */

function rocDate(value){

  if(!value){
    return "";
  }

  const d = new Date(value + "T00:00:00");

  return `${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;

}



/* =========================================================
   金額格式
========================================================= */

function money(value){

  return Number(value || 0).toLocaleString("zh-TW");

}



/* =========================================================
   Canvas 文字
========================================================= */

function drawText(
  ctx,
  text,
  x,
  y,
  size = 27,
  align = "left",
  weight = "400"
){

  ctx.save();

  ctx.font =
    `${weight} ${size}px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif`;

  ctx.fillStyle = "#111";

  ctx.textAlign = align;

  ctx.textBaseline = "middle";

  ctx.fillText(text,x,y);

  ctx.restore();

}



/* =========================================================
   非破壞式清除文字

   重要：

   這裡「不是」用白色矩形蓋掉。

   只處理接近黑色的原始文字像素，
   因此：

   ✓ 灰色浮水印保留
   ✓ 表格線保留
   ✓ 店章保留
   ✓ 收據底圖保留

========================================================= */

function eraseDarkText(
  ctx,
  x,
  y,
  width,
  height,
  threshold = 120
){

  const imageData =
    ctx.getImageData(x,y,width,height);

  const data =
    imageData.data;


  for(let i=0;i<data.length;i+=4){

    const r = data[i];
    const g = data[i+1];
    const b = data[i+2];


    /*
      只抓深色／黑色文字。

      灰色浮水印通常比這個值亮，
      因此不會被清除。
    */

    if(
      r < threshold &&
      g < threshold &&
      b < threshold
    ){

      /*
        改成白色。
        
        這不是「白色底圖覆蓋」，
        而是只把原本的黑色文字像素
        還原成該區域的白色背景。
      */

      data[i] = 255;
      data[i+1] = 255;
      data[i+2] = 255;
      data[i+3] = 255;

    }

  }


  ctx.putImageData(imageData,x,y);

}



/* =========================================================
   清除頂部黑色文字

   頂部沒有浮水印，所以可以直接清除。
========================================================= */

function clearHeaderText(
  ctx,
  x,
  y,
  width,
  height
){

  ctx.save();

  ctx.fillStyle = "#fff";

  ctx.fillRect(x,y,width,height);

  ctx.restore();

}



/* =========================================================
   重新畫表格線

   只補被清除文字碰到的線。
========================================================= */

function drawTableLines(ctx){

  ctx.save();

  ctx.strokeStyle = "#bdbdbd";

  ctx.lineWidth = 1;

  ctx.setLineDash([3,3]);


  /*
    表格垂直線
  */

  const vertical = [
    356,
    465,
    585,
    724
  ];


  vertical.forEach(x => {

    ctx.beginPath();

    ctx.moveTo(x,223);

    ctx.lineTo(x,501);

    ctx.stroke();

  });


  /*
    表格水平虛線
  */

  const horizontal = [
    291,
    333,
    376,
    419,
    461
  ];


  horizontal.forEach(y => {

    ctx.beginPath();

    ctx.moveTo(51,y);

    ctx.lineTo(724,y);

    ctx.stroke();

  });


  ctx.setLineDash([]);


  /*
    小計、折扣、總計區域
  */

  ctx.strokeStyle = "#111";

  ctx.lineWidth = 2;


  const solid = [
    501,
    585,
    629
  ];


  solid.forEach(y => {

    ctx.beginPath();

    ctx.moveTo(51,y);

    ctx.lineTo(963,y);

    ctx.stroke();

  });


  ctx.restore();

}



/* =========================================================
   頂部「統一編號 / 單號」

   固定成：

   統一編號： 03796404
   單   號： 0afb 867-2

   冒號使用完全相同 X 座標。
========================================================= */

function drawNumbers(
  ctx,
  tax,
  order
){

  /*
    所有定位以原始收據為準。
  */

  const labelX = 600;

  const colonX = 680;

  const valueX = 700;


  const y1 = 124;

  const y2 = 156;


  /* 統一編號 */

  drawText(
    ctx,
    "統一編號",
    labelX,
    y1,
    19,
    "left"
  );


  drawText(
    ctx,
    "：",
    colonX,
    y1,
    19,
    "left"
  );


  drawText(
    ctx,
    tax,
    valueX,
    y1,
    19,
    "left"
  );


  /* 單號 */

  drawText(
    ctx,
    "單   號",
    labelX,
    y2,
    19,
    "left"
  );


  drawText(
    ctx,
    "：",
    colonX,
    y2,
    19,
    "left"
  );


  drawText(
    ctx,
    order,
    valueX,
    y2,
    19,
    "left"
  );

}



/* =========================================================
   產生收據
========================================================= */

function makeReceipt(){

  if(!img.complete){

    img.onload = makeReceipt;

    return;

  }


  /*
    直接使用原始圖片尺寸。

    不再硬塞 1499 x 1007，
    避免定位比例跑掉。
  */

  const canvas =
    $("receipt");

  canvas.width =
    img.naturalWidth;

  canvas.height =
    img.naturalHeight;


  const ctx =
    canvas.getContext("2d");


  /*
    重新畫原始收據
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    img,
    0,
    0
  );



  /* =====================================================
     讀取資料
  ===================================================== */

  const date =
    $("date").value;

  const nights =
    Number($("nights").value || 1);

  const price =
    Number($("price").value || 0);

  const total =
    nights * price;

  const title =
    $("title").value.trim();

  const tax =
    $("tax").value.trim();

  const order =
    $("order").value.trim();

  const address =
    $("address").value.trim();

  const item =
    $("item").value.trim();



  /* =====================================================
     ① 日期

     原始位置約：
     中央 / y 94
  ===================================================== */

  clearHeaderText(
    ctx,
    300,
    75,
    400,
    40
  );


  drawText(
    ctx,
    rocDate(date),
    500,
    94,
    19,
    "center"
  );



  /* =====================================================
     ② 抬頭

     ★ 與地址使用完全相同 X = 60

     有輸入：
     抬頭：臺灣高等法院

     沒輸入：
     完全不顯示
  ===================================================== */

  clearHeaderText(
    ctx,
    45,
    105,
    530,
    40
  );


  if(title){

    drawText(
      ctx,
      `抬頭：${title}`,
      60,
      124,
      19,
      "left"
    );

  }



  /* =====================================================
     ③ 統一編號 / 單號

     先清掉原始底圖兩行文字。

     這是解決「出現兩個單號」的關鍵。
  ===================================================== */

  clearHeaderText(
    ctx,
    575,
    105,
    270,
    70
  );


  drawNumbers(
    ctx,
    tax,
    order
  );



  /* =====================================================
     ④ 地址

     ★ X = 60
     與抬頭完全齊頭
  ===================================================== */

  clearHeaderText(
    ctx,
    45,
    140,
    520,
    30
  );


  drawText(
    ctx,
    address
      ? `地址： ${address}`
      : "地址：",
    60,
    157,
    19,
    "left"
  );



  /* =====================================================
     ⑤ 品名第一列

     只清除原本的黑色文字。

     不覆蓋灰色「沐光」浮水印。
  ===================================================== */

  eraseDarkText(
    ctx,
    55,
    225,
    295,
    65,
    130
  );


  drawText(
    ctx,
    item,
    203,
    246,
    18,
    "center",
    "600"
  );


  drawText(
    ctx,
    `《${date ? date.slice(5).replace("-","/") : ""}》`,
    203,
    270,
    17,
    "center"
  );



  /* =====================================================
     ⑥ 天數
  ===================================================== */

  eraseDarkText(
    ctx,
    360,
    225,
    100,
    65,
    130
  );


  drawText(
    ctx,
    String(nights),
    410,
    256,
    19,
    "center"
  );



  /* =====================================================
     ⑦ 單價
  ===================================================== */

  eraseDarkText(
    ctx,
    470,
    225,
    110,
    65,
    130
  );


  drawText(
    ctx,
    `$ ${money(price)}`,
    525,
    256,
    18,
    "center"
  );



  /* =====================================================
     ⑧ 總價
  ===================================================== */

  eraseDarkText(
    ctx,
    590,
    225,
    130,
    65,
    130
  );


  drawText(
    ctx,
    `$ ${money(total)}`,
    655,
    256,
    18,
    "center"
  );



  /* =====================================================
     ⑨ 原本「===以下空白===」

     移除這個模板文字。

     只清除黑色文字，
     不影響浮水印。
  ===================================================== */

  eraseDarkText(
    ctx,
    55,
    292,
    180,
    35,
    130
  );



  /* =====================================================
     ⑩ 小計

     原本的小計金額保留版面，
     只清掉舊數字，再畫新的。
  ===================================================== */

  eraseDarkText(
    ctx,
    585,
    500,
    140,
    40,
    130
  );


  drawText(
    ctx,
    `$${money(total)}`,
    680,
    521,
    18,
    "right"
  );



  /* =====================================================
     ⑪ 折扣

     原模板「折扣」保留。
     目前沒有折扣輸入欄位，
     所以不重新產生數字。
  ===================================================== */



  /* =====================================================
     ⑫ 總計

     清除原模板總計金額，
     再輸出新的總計。
  ===================================================== */

  eraseDarkText(
    ctx,
    585,
    586,
    140,
    40,
    130
  );


  drawText(
    ctx,
    `$${money(total)}`,
    680,
    608,
    18,
    "right"
  );



  /*
    最後補回表格線。

    只處理線條，
    不覆蓋浮水印。
  */

  drawTableLines(ctx);

}



/* =========================================================
   JPG 下載
========================================================= */

function downloadJpg(){

  const canvas =
    $("receipt");


  const a =
    document.createElement("a");


  a.download =
    "沐光民宿二館_收據.jpg";


  a.href =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );


  a.click();

}



/* =========================================================
   恢復測試資料
========================================================= */

function resetForm(){

  $("date").value =
    "2024-12-12";

  $("nights").value =
    1;

  $("price").value =
    2000;

  $("title").value =
    "臺灣高等法院";

  $("tax").value =
    "03796404";

  $("order").value =
    "0afb 867-2";

  $("address").value =
    "";

  $("item").value =
    "沐光 住宿公務保留房費";


  makeReceipt();

}



/* =========================================================
   初始載入
========================================================= */

img.onload =
  makeReceipt;


</script>

</body>

</html>
