<!doctype html>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f3f6fa;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif
}

}

}

  padding:18px

<body>

<header>

<div class="wrap">

<h1>🏠 民宿電子收據系統</h1>

<p>第一個可填寫版本｜沐光民宿二館</p>

</div>

</header>


<main class="wrap">


<section class="card">

<h2>① 輸入收據資料</h2>


<div class="form">


<label>
入住日期
<input id="date" type="date" value="2024-12-12">
</label>


<label>
住宿天數
<input id="nights" type="number" min="1" value="1">
</label>


<label>
單價
<input id="price" type="number" min="0" value="2000">
</label>


<label>
抬頭
<input id="title" value="臺灣高等法院">
</label>


<label>
統一編號
<input id="tax" value="03796404">
</label>


<label>
訂單編號
<input id="order" value="0afb 867-2">
</label>


<label>
地址
<input id="address" value="">
</label>


<label class="full">
品名摘要
<input id="item" value="沐光 住宿公務保留房費">
</label>


</div>


<div class="actions">

<button class="primary" onclick="makeReceipt()">
產生預覽
</button>

<button class="secondary" onclick="resetForm()">
恢復測試資料
</button>

</div>

</section>



<section class="card">

<h2>② 收據預覽</h2>


<div class="note">

目前是「第一個自動套版測試版」。<br>
原始收據圖片作為底圖，因此灰色「沐光」浮水印會保留。

</div>


<br>


<div class="preview-wrap">

<canvas id="receipt" width="1499" height="1007"></canvas>

</div>


<div class="actions">

<button class="primary" onclick="downloadJpg()">
下載 JPG（測試版）
</button>

</div>


</section>

<script>


const W=1499;
const H=1007;


const img=new Image();

img.src="receipt-template-m2.png";


const $=id=>document.getElementById(id);



/* =========================
   民國日期
========================= */

function rocDate(v){

  if(!v)return "";

  const d=new Date(v+"T00:00:00");

  return `${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;

}



/* =========================
   金額格式
========================= */

function money(n){

  return Number(n||0).toLocaleString("zh-TW");

}



/* =========================
   畫文字
========================= */

function drawText(
  ctx,
  text,
  x,
  y,
  size=28,
  align="left",
  weight="400"
){

  ctx.save();

  ctx.font=
    `${weight} ${size}px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif`;

  ctx.fillStyle="#111";

  ctx.textAlign=align;

  ctx.textBaseline="middle";

  ctx.fillText(text,x,y);

  ctx.restore();

}



/* =========================
   清除頂部文字區域
========================= */

function clearTop(ctx,x,y,w,h){

  ctx.save();

  ctx.fillStyle="#ffffff";

  ctx.fillRect(x,y,w,h);

  ctx.restore();

}



/* =========================
   清除表格文字區域
========================= */

function clearTableCell(ctx,x,y,w,h){

  ctx.save();

  ctx.fillStyle="#ffffff";

  ctx.fillRect(x,y,w,h);

  ctx.restore();

}



/* =========================
   重新繪製表格線
========================= */

function redrawTableLines(ctx){

  ctx.save();

  ctx.strokeStyle="#bdbdbd";

  ctx.lineWidth=2;

  ctx.setLineDash([4,4]);


  const verticalLines=[
    534,
    697,
    875,
    1080
  ];


  verticalLines.forEach(x=>{

    ctx.beginPath();

    ctx.moveTo(x,330);

    ctx.lineTo(x,750);

    ctx.stroke();

  });


  const horizontalLines=[
    425,
    465,
    505,
    545,
    585,
    625,
    665,
    705
  ];


  horizontalLines.forEach(y=>{

    ctx.beginPath();

    ctx.moveTo(76,y);

    ctx.lineTo(1080,y);

    ctx.stroke();

  });


  ctx.setLineDash([]);


  ctx.strokeStyle="#111";

  ctx.lineWidth=2;


  const solidLines=[
    750,
    810,
    870,
    935
  ];


  solidLines.forEach(y=>{

    ctx.beginPath();

    ctx.moveTo(76,y);

    ctx.lineTo(1080,y);

    ctx.stroke();

  });


  ctx.restore();

}



/* ==================================================
   統一編號／單號

   兩行使用固定欄位定位：

   統一編號： 03796404
   單   號： 0afb 867-2

   冒號位置完全一致
================================================== */

function drawCompanyNumbers(ctx,tax,order){

  const labelX=890;

  const valueX=1005;

  const labelY1=190;

  const labelY2=235;


  /* 統一編號 */

  drawText(
    ctx,
    "統一編號",
    labelX,
    labelY1,
    27,
    "left"
  );


  drawText(
    ctx,
    "：",
    978,
    labelY1,
    27,
    "left"
  );


  drawText(
    ctx,
    tax,
    valueX,
    labelY1,
    27,
    "left"
  );


  /* 單號 */

  drawText(
    ctx,
    "單   號",
    labelX,
    labelY2,
    27,
    "left"
  );


  drawText(
    ctx,
    "：",
    978,
    labelY2,
    27,
    "left"
  );


  drawText(
    ctx,
    order,
    valueX,
    labelY2,
    27,
    "left"
  );

}



/* ==================================================
   產生收據
================================================== */

function makeReceipt(){


  if(!img.complete){

    img.onload=makeReceipt;

    return;

  }


  const c=$("receipt");

  const ctx=c.getContext("2d");


  /* 重新載入原始收據底圖 */

  ctx.clearRect(0,0,W,H);

  ctx.drawImage(img,0,0,W,H);



  /* 取得輸入資料 */

  const date=$("date").value;

  const n=Number($("nights").value||1);

  const price=Number($("price").value||0);

  const total=n*price;

  const title=$("title").value.trim();

  const tax=$("tax").value.trim();

  const order=$("order").value.trim();

  const addr=$("address").value.trim();

  const item=$("item").value.trim();



  /* ==================================================
     1. 入住日期
  ================================================== */

  clearTop(
    ctx,
    430,
    108,
    650,
    52
  );


  drawText(
    ctx,
    rocDate(date),
    755,
    135,
    30,
    "center"
  );



  /* ==================================================
     2. 抬頭

     與地址完全相同 X 座標
  ================================================== */

  clearTop(
    ctx,
    75,
    158,
    800,
    55
  );


  if(title){

    drawText(
      ctx,
      `抬頭：${title}`,
      80,
      190,
      29,
      "left"
    );

  }



  /* ==================================================
     3. 統一編號＋單號

     先完整清除兩行原始文字，
     再用固定定位重新繪製。
  ================================================== */

  clearTop(
    ctx,
    885,
    158,
    400,
    110
  );


  drawCompanyNumbers(
    ctx,
    tax,
    order
  );



  /* ==================================================
     4. 地址

     與抬頭同一個 X 座標
  ================================================== */

  clearTop(
    ctx,
    75,
    205,
    800,
    55
  );


  drawText(
    ctx,
    addr ? `地址：${addr}` : "地址：",
    80,
    235,
    27,
    "left"
  );



  /* ==================================================
     5. 品名摘要
  ================================================== */

  clearTableCell(
    ctx,
    77,
    330,
    455,
    95
  );


  drawText(
    ctx,
    item,
    300,
    362,
    27,
    "center"
  );


  drawText(
    ctx,
    `《${date ? date.slice(5).replace("-","/") : ""}》`,
    300,
    400,
    25,
    "center"
  );



  /* ==================================================
     6. 天數
  ================================================== */

  clearTableCell(
    ctx,
    535,
    330,
    160,
    95
  );


  drawText(
    ctx,
    String(n),
    615,
    378,
    28,
    "center"
  );



  /* ==================================================
     7. 單價
  ================================================== */

  clearTableCell(
    ctx,
    697,
    330,
    178,
    95
  );


  drawText(
    ctx,
    `$ ${money(price)}`,
    785,
    378,
    27,
    "center"
  );



  /* ==================================================
     8. 總價
  ================================================== */

  clearTableCell(
    ctx,
    875,
    330,
    205,
    95
  );


  drawText(
    ctx,
    `$ ${money(total)}`,
    980,
    378,
    27,
    "center"
  );



  /* ==================================================
     9. 小計
  ================================================== */

  clearTableCell(
    ctx,
    875,
    746,
    205,
    65
  );


  drawText(
    ctx,
    `$${money(total)}`,
    980,
    778,
    29,
    "center"
  );



  /* ==================================================
     10. 折扣

     目前沒有輸入欄位，
     保留原模板。
  ================================================== */



  /* ==================================================
     11. 總計
  ================================================== */

  clearTableCell(
    ctx,
    875,
    870,
    205,
    65
  );


  drawText(
    ctx,
    `$${money(total)}`,
    980,
    902,
    29,
    "center"
  );



  /* 最後補回表格線 */

  redrawTableLines(ctx);

}



/* ==================================================
   下載 JPG
================================================== */

function downloadJpg(){

  const c=$("receipt");

  const a=document.createElement("a");

  a.download="沐光民宿二館_收據.jpg";

  a.href=c.toDataURL("image/jpeg",0.88);

  a.click();

}



/* ==================================================
   恢復測試資料
================================================== */

function resetForm(){

  $("date").value="2024-12-12";

  $("nights").value=1;

  $("price").value=2000;

  $("title").value="臺灣高等法院";

  $("tax").value="03796404";

  $("order").value="0afb 867-2";

  $("address").value="";

  $("item").value="沐光 住宿公務保留房費";

  makeReceipt();

}



/* ==================================================
   初始載入
================================================== */

img.onload=makeReceipt;


</script>

</body>

</html>
```
