<body>

<div class="wrap">

  <h1>沐光民宿二館｜免用統一發票 電子收據</h1>

  <div class="panel">

    <div class="grid">

<script>

"use strict";


/* =========================================================
   模板設定
   ========================================================= */

const TEMPLATE = "receipt-template-1.png";

/*
  最新模板實際尺寸
  2506 × 1436 px
*/
const W = 2506;
const H = 1436;

const TARGET_MAX_BYTES = 1024 * 1024;


/* =========================================================
   取得表單元素
   ========================================================= */

const $ = id => document.getElementById(id);

const dateEl = $("date");
const nightsEl = $("nights");
const priceEl = $("price");
const taxIdEl = $("taxId");
const orderNoEl = $("orderNo");
const titleEl = $("title");
const addressEl = $("address");
const itemEl = $("item");

const previewImg = $("previewImg");
const statusEl = $("status");

let lastCanvas = null;


/* =========================================================
   載入模板
   ========================================================= */

const img = new Image();

img.src = TEMPLATE;


/* =========================================================
   日期
   ========================================================= */

function setDefaultDate() {

  const d = new Date();

  const yyyy = d.getFullYear();

  const mm = String(
    d.getMonth() + 1
  ).padStart(2, "0");

  const dd = String(
    d.getDate()
  ).padStart(2, "0");

  dateEl.value =
    `${yyyy}-${mm}-${dd}`;
}


/* =========================================================
   金額格式
   ========================================================= */

function money(value) {

  const n = Number(value) || 0;

  return "$" + n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits: 0
    }
  );
}


/* =========================================================
   文字大小自動縮小
   ========================================================= */

function fitText(
  ctx,
  text,
  maxWidth,
  initialSize,
  minSize = 14
) {

  let size = initialSize;

  while (size > minSize) {

    ctx.font =
      `600 ${size}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

    if (
      ctx.measureText(text).width <= maxWidth
    ) {
      break;
    }

    size--;
  }

  return size;
}


/* =========================================================
   置中文字
   ========================================================= */

function drawCentered(
  ctx,
  text,
  x,
  y,
  size,
  maxWidth = Infinity
) {

  const actualSize =
    fitText(
      ctx,
      text,
      maxWidth,
      size
    );

  ctx.font =
    `600 ${actualSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    text,
    x,
    y
  );
}


/* =========================================================
   靠右文字
   ========================================================= */

function drawRight(
  ctx,
  text,
  x,
  y,
  size
) {

  ctx.font =
    `600 ${size}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  ctx.fillText(
    text,
    x,
    y
  );
}


/* =========================================================
   建立收據
   ========================================================= */

function buildCanvas() {

  if (
    !img.complete ||
    !img.naturalWidth
  ) {

    throw new Error(
      "模板圖片尚未載入。請確認 receipt-template-1.png 與 index.html 在同一層。"
    );
  }


  /*
    ---------------------------------------------------------
    第一層：模板原圖
    ---------------------------------------------------------
  */

  const canvas =
    document.createElement("canvas");

  canvas.width = W;
  canvas.height = H;

  const ctx =
    canvas.getContext(
      "2d",
      { alpha: true }
    );


  /*
    完整保留新的空白模板
  */

  ctx.drawImage(
    img,
    0,
    0,
    W,
    H
  );


  /*
    ---------------------------------------------------------
    第二層：透明 Overlay
    ---------------------------------------------------------
  */

  const overlay =
    document.createElement("canvas");

  overlay.width = W;
  overlay.height = H;

  const octx =
    overlay.getContext(
      "2d",
      { alpha: true }
    );

  octx.clearRect(
    0,
    0,
    W,
    H
  );

  octx.fillStyle = "#111";


  /* =======================================================
     上方資訊區
     ======================================================= */

  /*
    日期
    新模板表格上緣約為 Y=392。
    日期放在上方空白區中央。
  */

  drawCentered(
    octx,
    dateEl.value || "",
    1253,
    150,
    30,
    500
  );


  /*
    ---------------------------------------------------------
    抬頭 / 地址
    ---------------------------------------------------------

    兩者使用完全相同的 X 起點。
  */

  const infoX = 80;

  const titleY = 230;
  const addressY = 275;


  const title =
    titleEl.value.trim();

  if (title) {

    const text =
      "抬頭：" + title;

    const size =
      fitText(
        octx,
        text,
        1080,
        29,
        16
      );

    octx.font =
      `600 ${size}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

    octx.textAlign = "left";
    octx.textBaseline = "middle";

    octx.fillText(
      text,
      infoX,
      titleY
    );
  }


  /*
    地址
  */

  const address =
    addressEl.value.trim();

  const addressText =
    "地址：" + address;

  const addressSize =
    fitText(
      octx,
      addressText,
      1080,
      29,
      16
    );

  octx.font =
    `600 ${addressSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

  octx.textAlign = "left";
  octx.textBaseline = "middle";

  octx.fillText(
    addressText,
    infoX,
    addressY
  );


  /* =======================================================
     統一編號 / 單號
     ======================================================= */

  /*
    兩行的：
    
    標籤
    冒號
    數值

    全部固定 X。

    產生：

    統一編號： 03796404
    單   號： 0afb867-2
  */

  const labelX = 1550;
  const colonX = 1685;
  const valueX = 1720;

  const taxY = 230;
  const orderY = 275;


  octx.font =
    `600 28px "Noto Sans TC","Microsoft JhengHei",sans-serif`;

  octx.textAlign = "left";
  octx.textBaseline = "middle";


  octx.fillText(
    "統一編號",
    labelX,
    taxY
  );

  octx.fillText(
    "：",
    colonX,
    taxY
  );

  octx.fillText(
    taxIdEl.value.trim(),
    valueX,
    taxY
  );


  octx.fillText(
    "單   號",
    labelX,
    orderY
  );

  octx.fillText(
    "：",
    colonX,
    orderY
  );

  octx.fillText(
    orderNoEl.value.trim(),
    valueX,
    orderY
  );


  /* =======================================================
     金額計算
     ======================================================= */

  const nights =
    Math.max(
      0,
      Number(nightsEl.value) || 0
    );

  const unitPrice =
    Math.max(
      0,
      Number(priceEl.value) || 0
    );

  const subtotal =
    nights * unitPrice;


  /* =======================================================
     表格座標
     ======================================================= */

  /*
    新模板實際主要欄線：

    品名摘要：
    X 約 49 ～ 962

    天數：
    X 約 962 ～ 1254

    單價：
    X 約 1254 ～ 1519

    總價：
    X 約 1519 ～ 1829

    備註：
    X 約 1829 ～ 2465
  */


  const itemCenterX = 505;
  const nightsCenterX = 1108;
  const priceCenterX = 1386;
  const totalRightX = 1805;


  /*
    第一筆明細列中心

    表頭底線約 Y=507
    第一列底線約 Y=620

    所以中心約 Y=564
  */

  const firstRowY = 564;


  /*
    品名
  */

  const item =
    itemEl.value.trim() || "住宿費";

  drawCentered(
    octx,
    item,
    itemCenterX,
    firstRowY,
    30,
    820
  );


  /*
    品名下面附日期
  */

  drawCentered(
    octx,
    dateEl.value || "",
    itemCenterX,
    firstRowY + 34,
    20,
    820
  );


  /*
    天數
  */

  drawCentered(
    octx,
    String(nights),
    nightsCenterX,
    firstRowY,
    30,
    180
  );


  /*
    單價

    不顯示 $，
    因為模板欄位名稱已經是「單價」。
  */

  drawCentered(
    octx,
    Number(unitPrice).toLocaleString("en-US"),
    priceCenterX,
    firstRowY,
    30,
    220
  );


  /*
    總價
  */

  drawRight(
    octx,
    money(subtotal),
    totalRightX,
    firstRowY,
    30
  );


  /* =======================================================
     小計
     ======================================================= */

  /*
    新模板：

    第一條粗線約 Y=1053
    小計 / 折扣 / 總計區域

    小計中心約 Y=1110
  */

  drawRight(
    octx,
    money(subtotal),
    totalRightX,
    1110,
    30
  );


  /* =======================================================
     折扣
     ======================================================= */

  /*
    目前系統沒有折扣輸入欄，
    因此折扣固定為 $0。
  */

  drawRight(
    octx,
    "$0",
    totalRightX,
    1225,
    30
  );


  /* =======================================================
     總計
     ======================================================= */

  drawRight(
    octx,
    money(subtotal),
    totalRightX,
    1338,
    30
  );


  /* =======================================================
     將透明 Overlay 合成到模板
     ======================================================= */

  ctx.drawImage(
    overlay,
    0,
    0
  );


  return canvas;
}


/* =========================================================
   預覽
   ========================================================= */

function showPreview() {

  try {

    const canvas =
      buildCanvas();

    lastCanvas = canvas;

    previewImg.src =
      canvas.toDataURL(
        "image/png"
      );

    statusEl.textContent =
      "預覽已更新。";

  } catch (error) {

    statusEl.textContent =
      error.message;
  }
}


/* =========================================================
   Canvas → Blob
   ========================================================= */

function blobFromCanvas(
  canvas,
  type,
  quality
) {

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (blob) {

            resolve(blob);

          } else {

            reject(
              new Error(
                "瀏覽器無法產生圖片。"
              )
            );
          }

        },
        type,
        quality
      );

    }
  );
}


/* =========================================================
   PNG 控制 1 MB
   ========================================================= */

async function makePngUnder1MB() {

  let canvas =
    lastCanvas || buildCanvas();

  let blob =
    await blobFromCanvas(
      canvas,
      "image/png"
    );


  /*
    如果原始 PNG 已經 <= 1 MB
    直接使用原尺寸。
  */

  if (
    blob.size <= TARGET_MAX_BYTES
  ) {

    return {
      blob,
      scale: 1
    };
  }


  /*
    PNG 沒有 quality 參數。

    所以超過 1 MB 時，
    自動縮小圖片。
  */

  let scale = 0.95;


  while (scale >= 0.40) {

    const c =
      document.createElement("canvas");

    c.width =
      Math.max(
        1,
        Math.round(W * scale)
      );

    c.height =
      Math.max(
        1,
        Math.round(H * scale)
      );

    const cx =
      c.getContext("2d");


    cx.drawImage(
      canvas,
      0,
      0,
      c.width,
      c.height
    );


    blob =
      await blobFromCanvas(
        c,
        "image/png"
      );


    if (
      blob.size <= TARGET_MAX_BYTES
    ) {

      return {
        blob,
        scale
      };
    }


    scale -= 0.05;
  }


  throw new Error(
    "PNG 即使縮小後仍無法控制在 1 MB 以下。"
  );
}


/* =========================================================
   JPG 控制 1 MB
   ========================================================= */

async function makeJpgUnder1MB() {

  const original =
    lastCanvas || buildCanvas();

  let scale = 1;


  while (scale >= 0.40) {

    let canvas =
      original;


    /*
      如果需要縮小
    */

    if (scale !== 1) {

      canvas =
        document.createElement("canvas");

      canvas.width =
        Math.max(
          1,
          Math.round(W * scale)
        );

      canvas.height =
        Math.max(
          1,
          Math.round(H * scale)
        );

      const ctx =
        canvas.getContext("2d");


      /*
        JPG 不支援透明，
        所以只有輸出 JPG 時
        才建立白色背景。
      */

      ctx.fillStyle = "#fff";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        original,
        0,
        0,
        canvas.width,
        canvas.height
      );
    }


    /*
      從高品質一路降低。
    */

    for (
      let quality = 0.92;
      quality >= 0.35;
      quality -= 0.05
    ) {

      const blob =
        await blobFromCanvas(
          canvas,
          "image/jpeg",
          quality
        );


      if (
        blob.size <= TARGET_MAX_BYTES
      ) {

        return {
          blob,
          scale,
          quality
        };
      }
    }


    scale -= 0.05;
  }


  throw new Error(
    "JPG 即使壓縮後仍無法控制在 1 MB 以下。"
  );
}


/* =========================================================
   檔名
   ========================================================= */

function safeFilename(ext) {

  const date =
    (dateEl.value || "receipt")
      .replaceAll("-", "");


  const order =
    orderNoEl.value
      .trim()
      .replace(
        /[^a-zA-Z0-9_-]/g,
        ""
      );


  const finalOrder =
    order || "receipt";


  return (
    `沐光民宿二館_${date}_${finalOrder}.${ext}`
  );
}


/* =========================================================
   下載
   ========================================================= */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    1500
  );
}


/* =========================================================
   PNG / JPG 下載
   ========================================================= */

async function download(type) {

  const pngButton =
    $("downloadPng");

  const jpgButton =
    $("downloadJpg");


  pngButton.disabled = true;
  jpgButton.disabled = true;


  try {

    statusEl.textContent =
      "正在產生檔案，並控制在 1 MB 以下……";


    lastCanvas =
      buildCanvas();


    let result;


    if (
      type === "png"
    ) {

      result =
        await makePngUnder1MB();

    } else {

      result =
        await makeJpgUnder1MB();
    }


    const sizeMB =
      (
        result.blob.size /
        1024 /
        1024
      ).toFixed(2);


    downloadBlob(
      result.blob,
      safeFilename(type)
    );


    let detail;


    if (
      type === "png"
    ) {

      detail =
        `縮放 ${Math.round(result.scale * 100)}%`;

    } else {

      detail =
        `縮放 ${Math.round(result.scale * 100)}%、品質 ${Math.round(result.quality * 100)}%`;
    }


    statusEl.textContent =
      `完成：${sizeMB} MB（${detail}）。`;
    

  } catch (error) {

    statusEl.textContent =
      "產生失敗：" +
      error.message;

  } finally {

    pngButton.disabled = false;
    jpgButton.disabled = false;
  }
}


/* =========================================================
   按鈕
   ========================================================= */

$("downloadPng")
  .addEventListener(
    "click",
    () => download("png")
  );


$("downloadJpg")
  .addEventListener(
    "click",
    () => download("jpg")
  );


/* =========================================================
   表單即時更新
   ========================================================= */

[
  dateEl,
  nightsEl,
  priceEl,
  taxIdEl,
  orderNoEl,
  titleEl,
  addressEl,
  itemEl
].forEach(
  element => {

    element.addEventListener(
      "input",
      showPreview
    );

  }
);


dateEl.addEventListener(
  "change",
  showPreview
);


/* =========================================================
   初始化
   ========================================================= */

setDefaultDate();


img.addEventListener(
  "load",
  showPreview
);


img.addEventListener(
  "error",
  () => {

    statusEl.textContent =
      "找不到 receipt-template-1.png。請確認它與 index.html 在 GitHub main 同一層。";

  }
);

</script>

</body>
</html>
