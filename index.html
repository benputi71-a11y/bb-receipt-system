<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>民宿電子收據系統｜沐光民宿二館</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fa;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

header{
  background:#174a8b;
  color:#fff;
  padding:20px;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

header p{
  margin:0;
  opacity:.9;
}

main{
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #0001;
}

h2{
  margin:0 0 15px;
  font-size:19px;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  font-size:14px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#174a8b;
  color:#fff;
}

.secondary{
  background:#e8eef6;
  color:#174a8b;
}

.preview-wrap{
  overflow:auto;
  background:#e9edf2;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

canvas{
  max-width:100%;
  height:auto;
  background:#fff;
  box-shadow:0 2px 8px #0002;
}

.note{
  background:#f7f9fc;
  border-left:4px solid #174a8b;
  padding:12px;
  line-height:1.65;
  font-size:14px;
}

@media(max-width:650px){

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>

</head>

<body>

<header>
  <div class="wrap">
    <h1>🏠 民宿電子收據系統</h1>
    <p>PNG 測試版｜沐光民宿二館</p>
  </div>
</header>


<main class="wrap">

<section class="card">

<h2>① 輸入收據資料</h2>

<div class="form">

<label>
  入住日期
  <input id="date" type="date" value="2024-12-12">
</label>

<label>
  住宿天數
  <input id="nights" type="number" min="1" value="1">
</label>

<label>
  單價
  <input id="price" type="number" min="0" value="2000">
</label>

<label>
  抬頭
  <input id="title" value="臺灣高等法院">
</label>

<label>
  統一編號
  <input id="tax" value="03796404">
</label>

<label>
  單號
  <input id="order" value="0afb 867-2">
</label>

<label>
  地址
  <input id="address" value="">
</label>

<label class="full">
  品名摘要
  <input id="item" value="沐光 住宿公務保留房費">
</label>

</div>

<div class="actions">

<button class="primary" onclick="makeReceipt()">
  產生預覽
</button>

<button class="secondary" onclick="resetForm()">
  恢復測試資料
</button>

</div>

</section>


<section class="card">

<h2>② 收據預覽</h2>

<div class="note">
  本版本直接使用原始收據模板尺寸，不再使用固定的
  1499 × 1007 尺寸。新增文字以透明圖層方式合成，
  最終下載 PNG；若檔案超過 1MB，系統會自動縮小。
</div>

<br>

<div class="preview-wrap">
  <canvas id="receipt"></canvas>
</div>

<div class="actions">

<button class="primary" onclick="downloadPng()">
  下載 PNG（1MB 以下）
</button>

</div>

</section>

</main>


<script>

/* =========================================================
   原始模板
   ========================================================= */

const img = new Image();

img.src = "receipt-template-m2.png";

const $ = id => document.getElementById(id);


/* =========================================================
   民國日期
   ========================================================= */

function rocDate(value){

  if(!value){
    return "";
  }

  const d =
    new Date(value + "T00:00:00");

  return (
    `${d.getFullYear()-1911} 年 ` +
    `${d.getMonth()+1} 月 ` +
    `${d.getDate()} 日`
  );
}


/* =========================================================
   金額格式
   ========================================================= */

function money(value){

  return Number(value || 0)
    .toLocaleString("zh-TW");
}


/* =========================================================
   文字
   ========================================================= */

function drawText(
  ctx,
  text,
  x,
  y,
  size=18,
  align="left",
  weight="400"
){

  ctx.save();

  ctx.font =
    `${weight} ${size}px ` +
    `"Noto Sans TC","PingFang TC",sans-serif`;

  ctx.fillStyle = "#111";

  ctx.textAlign = align;

  ctx.textBaseline = "middle";

  ctx.fillText(
    text,
    x,
    y
  );

  ctx.restore();
}


/* =========================================================
   清除原模板深色文字
   ---------------------------------------------------------
   不使用 fillRect 白色方塊。
   只處理深色像素，盡量保留灰色浮水印。
   ========================================================= */

function eraseDarkText(
  ctx,
  x,
  y,
  width,
  height,
  threshold=120
){

  x = Math.max(0,Math.floor(x));
  y = Math.max(0,Math.floor(y));

  width =
    Math.min(
      Math.floor(width),
      ctx.canvas.width - x
    );

  height =
    Math.min(
      Math.floor(height),
      ctx.canvas.height - y
    );

  if(width <= 0 || height <= 0){
    return;
  }

  const imageData =
    ctx.getImageData(
      x,
      y,
      width,
      height
    );

  const data =
    imageData.data;

  for(let i=0;i<data.length;i+=4){

    const r=data[i];
    const g=data[i+1];
    const b=data[i+2];

    /*
      只有真正偏黑的文字才處理。
      灰色浮水印盡量保留。
    */

    if(
      r < threshold &&
      g < threshold &&
      b < threshold
    ){

      data[i]   = 255;
      data[i+1] = 255;
      data[i+2] = 255;
      data[i+3] = 255;

    }
  }

  ctx.putImageData(
    imageData,
    x,
    y
  );
}


/* =========================================================
   建立透明文字圖層
   ========================================================= */

function createOverlay(){

  const canvas =
    document.createElement("canvas");

  canvas.width =
    img.naturalWidth;

  canvas.height =
    img.naturalHeight;

  return canvas;
}


/* =========================================================
   產生收據
   ========================================================= */

function makeReceipt(){

  if(
    !img.complete ||
    !img.naturalWidth
  ){

    img.onload =
      makeReceipt;

    return;
  }


  /*
    非常重要：

    直接使用模板實際尺寸。
    不再寫死 1499 × 1007。
  */

  const W =
    img.naturalWidth;

  const H =
    img.naturalHeight;


  const canvas =
    $("receipt");

  canvas.width = W;
  canvas.height = H;


  const ctx =
    canvas.getContext("2d");


  /*
    清空後重新放入原始模板。
  */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.drawImage(
    img,
    0,
    0
  );


  /*
    建立透明文字圖層。
  */

  const overlay =
    createOverlay();

  const octx =
    overlay.getContext("2d");


  /* =======================================================
     取得資料
     ======================================================= */

  const date =
    $("date").value;

  const nights =
    Number(
      $("nights").value || 1
    );

  const price =
    Number(
      $("price").value || 0
    );

  const total =
    nights * price;

  const title =
    $("title").value.trim();

  const tax =
    $("tax").value.trim();

  const order =
    $("order").value.trim();

  const address =
    $("address").value.trim();

  const item =
    $("item").value.trim();


  /* =======================================================
     日期
     ======================================================= */

  eraseDarkText(
    ctx,
    350,
    72,
    300,
    50
  );

  drawText(
    octx,
    rocDate(date),
    500,
    94,
    18,
    "center"
  );


  /* =======================================================
     抬頭
     -------------------------------------------------------
     與地址 X 起點完全相同。
     ======================================================= */

  eraseDarkText(
    ctx,
    45,
    105,
    480,
    40
  );

  if(title){

    drawText(
      octx,
      `抬頭：${title}`,
      60,
      124,
      18,
      "left"
    );

  }


  /* =======================================================
     統一編號
     -------------------------------------------------------
     labelX / colonX / valueX 固定。
     ======================================================= */

  eraseDarkText(
    ctx,
    570,
    105,
    300,
    35
  );

  const labelX = 600;
  const colonX = 680;
  const valueX = 700;

  const numberY1 = 124;
  const numberY2 = 157;


  drawText(
    octx,
    "統一編號",
    labelX,
    numberY1,
    18,
    "left"
  );

  drawText(
    octx,
    "：",
    colonX,
    numberY1,
    18,
    "left"
  );

  drawText(
    octx,
    tax,
    valueX,
    numberY1,
    18,
    "left"
  );


  /* =======================================================
     地址
     ======================================================= */

  eraseDarkText(
    ctx,
    45,
    135,
    500,
    35
  );

  drawText(
    octx,
    address
      ? `地址：${address}`
      : "地址：",
    60,
    157,
    18,
    "left"
  );


  /* =======================================================
     單號
     -------------------------------------------------------
     與統一編號完全使用相同 X。
     ======================================================= */

  eraseDarkText(
    ctx,
    570,
    135,
    300,
    35
  );

  drawText(
    octx,
    "單   號",
    labelX,
    numberY2,
    18,
    "left"
  );

  drawText(
    octx,
    "：",
    colonX,
    numberY2,
    18,
    "left"
  );

  drawText(
    octx,
    order,
    valueX,
    numberY2,
    18,
    "left"
  );


  /* =======================================================
     品名
     ======================================================= */

  eraseDarkText(
    ctx,
    60,
    230,
    285,
    52
  );

  drawText(
    octx,
    item,
    203,
    248,
    17,
    "center"
  );


  /* =======================================================
     日期小字
     ======================================================= */

  eraseDarkText(
    ctx,
    90,
    252,
    230,
    30
  );

  drawText(
    octx,
    date
      ? `《${date.slice(5).replace("-","/")}》`
      : "",
    203,
    270,
    16,
    "center"
  );


  /* =======================================================
     住宿天數
     ======================================================= */

  eraseDarkText(
    ctx,
    370,
    230,
    85,
    52
  );

  drawText(
    octx,
    String(nights),
    411,
    257,
    18,
    "center"
  );


  /* =======================================================
     單價
     ======================================================= */

  eraseDarkText(
    ctx,
    475,
    230,
    105,
    52
  );

  drawText(
    octx,
    `$ ${money(price)}`,
    525,
    257,
    17,
    "center"
  );


  /* =======================================================
     第一列小計
     ======================================================= */

  eraseDarkText(
    ctx,
    590,
    230,
    125,
    52
  );

  drawText(
    octx,
    `$ ${money(total)}`,
    654,
    257,
    17,
    "center"
  );


  /* =======================================================
     ===以下空白===
     ======================================================= */

  eraseDarkText(
    ctx,
    55,
    295,
    180,
    30
  );


  /* =======================================================
     下方小計
     ======================================================= */

  eraseDarkText(
    ctx,
    640,
    505,
    80,
    32
  );

  drawText(
    octx,
    `$${money(total)}`,
    685,
    522,
    17,
    "center"
  );


  /* =======================================================
     折扣
     -------------------------------------------------------
     目前尚未建立折扣輸入欄，
     因此保留模板原有「折扣」文字。
     ======================================================= */


  /* =======================================================
     下方總計
     ======================================================= */

  eraseDarkText(
    ctx,
    640,
    590,
    80,
    32
  );

  drawText(
    octx,
    `$${money(total)}`,
    685,
    607,
    17,
    "center"
  );


  /* =======================================================
     最後才把透明文字圖層合成
     ======================================================= */

  ctx.drawImage(
    overlay,
    0,
    0
  );

}


/* =========================================================
   Canvas → PNG Blob
   ========================================================= */

function canvasToBlob(canvas){

  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      "image/png"
    );

  });

}


/* =========================================================
   下載 PNG
   ---------------------------------------------------------
   最大 1MB
   ========================================================= */

async function downloadPng(){

  const source =
    $("receipt");

  const MAX_SIZE =
    1024 * 1024;


  if(
    !source.width ||
    !source.height
  ){

    makeReceipt();

  }


  /*
    先嘗試原始尺寸。
  */

  let blob =
    await canvasToBlob(source);

  let exportCanvas =
    source;


  /*
    超過 1MB 才縮小。
  */

  if(blob.size > MAX_SIZE){

    let scale = 0.95;

    while(
      blob.size > MAX_SIZE &&
      scale >= 0.50
    ){

      const c =
        document.createElement("canvas");

      c.width =
        Math.floor(
          source.width * scale
        );

      c.height =
        Math.floor(
          source.height * scale
        );


      const cctx =
        c.getContext("2d");

      cctx.imageSmoothingEnabled =
        true;

      cctx.imageSmoothingQuality =
        "high";


      cctx.drawImage(
        source,
        0,
        0,
        c.width,
        c.height
      );


      const newBlob =
        await canvasToBlob(c);


      exportCanvas =
        c;

      blob =
        newBlob;

      scale -= 0.05;

    }

  }


  /*
    如果仍然超過 1MB，
    最後再做一次比例縮小。
  */

  if(blob.size > MAX_SIZE){

    const scale =
      Math.sqrt(
        MAX_SIZE / blob.size
      ) * 0.95;

    const c =
      document.createElement("canvas");

    c.width =
      Math.floor(
        source.width * scale
      );

    c.height =
      Math.floor(
        source.height * scale
      );

    const cctx =
      c.getContext("2d");

    cctx.imageSmoothingEnabled =
      true;

    cctx.imageSmoothingQuality =
      "high";

    cctx.drawImage(
      source,
      0,
      0,
      c.width,
      c.height
    );

    blob =
      await canvasToBlob(c);

    exportCanvas =
      c;

  }


  /*
    最終安全檢查。
  */

  if(blob.size > MAX_SIZE){

    alert(
      "目前 PNG 仍超過 1MB，請稍微降低圖片尺寸後再試。"
    );

    return;
  }


  /*
    開始下載。
  */

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    "沐光民宿二館_收據.png";

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );


  const kb =
    (blob.size / 1024).toFixed(1);

  alert(
    `PNG 已產生\n檔案大小：約 ${kb} KB`
  );

}


/* =========================================================
   恢復測試資料
   ========================================================= */

function resetForm(){

  $("date").value =
    "2024-12-12";

  $("nights").value =
    "1";

  $("price").value =
    "2000";

  $("title").value =
    "臺灣高等法院";

  $("tax").value =
    "03796404";

  $("order").value =
    "0afb 867-2";

  $("address").value =
    "";

  $("item").value =
    "沐光 住宿公務保留房費";


  makeReceipt();

}


/* =========================================================
   初始產生
   ========================================================= */

img.onload =
  makeReceipt;

</script>

</body>

</html>
