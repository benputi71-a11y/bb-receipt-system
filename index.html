<script>

"use strict";


/* =========================================================
   模板
   ========================================================= */

const TEMPLATE =
  "receipt-template-1.png";


/* =========================================================
   最新模板尺寸
   ========================================================= */

const W = 2514;
const H = 1456;


/* =========================================================
   最大檔案大小
   ========================================================= */

const TARGET_MAX_BYTES =
  1024 * 1024;


/* =========================================================
   收據字體
   =========================================================

   改成比較細的 Regular 字體。

   Noto Sans TC：
   400 = 一般細字

   如果裝置沒有，
   再 fallback 到 Helvetica Neue。
   ========================================================= */

const RECEIPT_FONT_FAMILY =
  '"Noto Sans TC", "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif';


const RECEIPT_FONT_WEIGHT =
  400;


/* =========================================================
   收據字體大小
   ========================================================= */

const RECEIPT_FONT_SIZE =
  60;


/* =========================================================
   日期左右範圍
   ========================================================= */

const DATE_LEFT_X =
  700;

const DATE_RIGHT_X =
  1824;


/* =========================================================
   表單
   ========================================================= */

const $ =
  id => document.getElementById(id);


const dateEl =
  $("date");

const nightsEl =
  $("nights");

const priceEl =
  $("price");

const taxIdEl =
  $("taxId");

const orderNoEl =
  $("orderNo");

const titleEl =
  $("title");

const addressEl =
  $("address");

const itemRowsEl =
  $("itemRows");

const addItemButton =
  $("addItem");

const previewImg =
  $("previewImg");

const statusEl =
  $("status");


let lastCanvas =
  null;


/* =========================================================
   品名選單

   可以在這裡自行增加選項。
   ========================================================= */

const ITEM_OPTIONS = [
  "住宿費",
  "清潔費",
  "加床費",
  "延遲退房費",
  "其他"
];


/* =========================================================
   最多 4 筆品項

   第 5 列保留給：
   《以下空白》
   ========================================================= */

const MAX_ITEMS =
  4;


/* =========================================================
   載入模板
   ========================================================= */

const img =
  new Image();

img.src =
  TEMPLATE;


/* =========================================================
   建立品項下拉選單
   ========================================================= */

function createItemRow(
  selectedValue = "住宿費"
) {

  if (
    itemRowsEl.children.length >=
    MAX_ITEMS
  ) {
    return;
  }


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "item-row";


  const select =
    document.createElement(
      "select"
    );

  select.className =
    "item-select";


  ITEM_OPTIONS.forEach(
    optionText => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        optionText;

      option.textContent =
        optionText;


      if (
        optionText ===
        selectedValue
      ) {

        option.selected =
          true;
      }


      select.appendChild(
        option
      );
    }
  );


  const removeButton =
    document.createElement(
      "button"
    );

  removeButton.type =
    "button";

  removeButton.className =
    "remove-item";

  removeButton.textContent =
    "刪除";


  removeButton.addEventListener(
    "click",
    () => {

      row.remove();

      updateAddButton();

      showPreview();

    }
  );


  select.addEventListener(
    "change",
    showPreview
  );


  row.appendChild(
    select
  );

  row.appendChild(
    removeButton
  );


  itemRowsEl.appendChild(
    row
  );


  updateAddButton();
}


/* =========================================================
   新增品項
   ========================================================= */

function updateAddButton() {

  const count =
    itemRowsEl.children.length;


  addItemButton.disabled =
    count >= MAX_ITEMS;


  if (
    count >= MAX_ITEMS
  ) {

    addItemButton.textContent =
      "已達 4 筆品項上限";

  } else {

    addItemButton.textContent =
      "＋ 新增品項";
  }
}


/* =========================================================
   取得所有品項
   ========================================================= */

function getItems() {

  const selects =
    [
      ...document.querySelectorAll(
        ".item-select"
      )
    ];


  return selects
    .map(
      select =>
        select.value.trim()
    )
    .filter(
      value =>
        value !== ""
    );
}


/* =========================================================
   設定今天日期
   ========================================================= */

function setDefaultDate() {

  const d =
    new Date();

  const yyyy =
    d.getFullYear();

  const mm =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");

  const dd =
    String(
      d.getDate()
    ).padStart(2, "0");

  dateEl.value =
    `${yyyy}-${mm}-${dd}`;
}


/* =========================================================
   西元 → 中華民國日期
   ========================================================= */

function formatROCDate(
  dateString
) {

  if (!dateString) {
    return "";
  }


  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {
    return dateString;
  }


  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);


  if (
    !year ||
    !month ||
    !day
  ) {
    return dateString;
  }


  const rocYear =
    year - 1911;


  return (
    `中華民國${rocYear}年${month}月${day}日`
  );
}


/* =========================================================
   日期字串 → 本地 Date
   ========================================================= */

function parseLocalDate(
  dateString
) {

  if (!dateString) {
    return null;
  }


  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {
    return null;
  }


  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);


  if (
    !year ||
    !month ||
    !day
  ) {
    return null;
  }


  return new Date(
    year,
    month - 1,
    day
  );
}


/* =========================================================
   日期 → 月/日
   ========================================================= */

function formatMonthDay(
  date
) {

  if (!date) {
    return "";
  }


  return (
    `${date.getMonth() + 1}/${date.getDate()}`
  );
}


/* =========================================================
   住宿日期區間
   =========================================================

   住 3 晚：
   9/5~9/7
   ========================================================= */

function getStayDateRange(
  dateString,
  nights
) {

  const start =
    parseLocalDate(
      dateString
    );


  const count =
    Math.max(
      0,
      Number(nights) || 0
    );


  if (!start) {
    return "";
  }


  if (count <= 0) {

    return formatMonthDay(
      start
    );
  }


  const end =
    new Date(start);


  end.setDate(
    end.getDate() +
    count -
    1
  );


  return (
    `${formatMonthDay(start)}~${formatMonthDay(end)}`
  );
}


/* =========================================================
   金額
   ========================================================= */

function money(
  value
) {

  const n =
    Number(value) || 0;


  return (
    "$" +
    n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits: 0
      }
    )
  );
}


/* =========================================================
   設定收據字體
   ========================================================= */

function setReceiptFont(
  ctx,
  size
) {

  ctx.font =
    `${RECEIPT_FONT_WEIGHT} ${size}px ${RECEIPT_FONT_FAMILY}`;
}


/* =========================================================
   自動縮小文字
   ========================================================= */

function fitText(
  ctx,
  text,
  maxWidth,
  initialSize,
  minSize = 16
) {

  let size =
    initialSize;


  while (
    size > minSize
  ) {

    setReceiptFont(
      ctx,
      size
    );


    if (
      ctx.measureText(text).width <=
      maxWidth
    ) {

      break;
    }


    size--;
  }


  return size;
}


/* =========================================================
   置中文字
   ========================================================= */

function drawCentered(
  ctx,
  text,
  x,
  y,
  size,
  maxWidth = Infinity
) {

  const actualSize =
    fitText(
      ctx,
      text,
      maxWidth,
      size
    );


  setReceiptFont(
    ctx,
    actualSize
  );


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    text,
    x,
    y
  );
}


/* =========================================================
   靠右文字
   ========================================================= */

function drawRight(
  ctx,
  text,
  x,
  y,
  size
) {

  setReceiptFont(
    ctx,
    size
  );


  ctx.textAlign =
    "right";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    text,
    x,
    y
  );
}


/* =========================================================
   日期拉寬排版
   ========================================================= */

function drawDateStretched(
  ctx,
  text,
  leftX,
  rightX,
  y,
  fontSize
) {

  if (!text) {
    return;
  }


  setReceiptFont(
    ctx,
    fontSize
  );


  ctx.textAlign =
    "left";

  ctx.textBaseline =
    "middle";


  let naturalWidth =
    0;


  for (
    const char of text
  ) {

    naturalWidth +=
      ctx.measureText(
        char
      ).width;
  }


  const targetWidth =
    rightX -
    leftX;


  const count =
    [...text].length;


  let spacing =
    0;


  if (count > 1) {

    spacing =
      (
        targetWidth -
        naturalWidth
      ) /
      (count - 1);
  }


  /*
    如果文字太寬，
    自動縮小。
  */

  if (spacing < 0) {

    const reducedSize =
      fitText(
        ctx,
        text,
        targetWidth,
        fontSize,
        30
      );


    drawCentered(
      ctx,
      text,
      (
        leftX +
        rightX
      ) / 2,
      y,
      reducedSize,
      targetWidth
    );


    return;
  }


  let x =
    leftX;


  for (
    const char of text
  ) {

    ctx.fillText(
      char,
      x,
      y
    );


    x +=
      ctx.measureText(
        char
      ).width +
      spacing;
  }
}


/* =========================================================
   建立收據
   ========================================================= */

function buildCanvas() {

  if (
    !img.complete ||
    !img.naturalWidth
  ) {

    throw new Error(
      "模板圖片尚未載入。請確認 receipt-template-1.png 與 index.html 在 GitHub main 同一層。"
    );
  }


  /* -------------------------------------------------------
     原始模板
     ------------------------------------------------------- */

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    W;

  canvas.height =
    H;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: true
      }
    );


  /*
    完整保留模板。
  */

  ctx.drawImage(
    img,
    0,
    0,
    W,
    H
  );


  /* -------------------------------------------------------
     透明文字層
     ------------------------------------------------------- */

  const overlay =
    document.createElement(
      "canvas"
    );


  overlay.width =
    W;

  overlay.height =
    H;


  const octx =
    overlay.getContext(
      "2d",
      {
        alpha: true
      }
    );


  octx.clearRect(
    0,
    0,
    W,
    H
  );


  octx.fillStyle =
    "#111";


  /* =======================================================
     日期
     ======================================================= */

  const rocDate =
    formatROCDate(
      dateEl.value
    );


  drawDateStretched(
    octx,
    rocDate,
    DATE_LEFT_X,
    DATE_RIGHT_X,
    155,
    RECEIPT_FONT_SIZE
  );


  /* =======================================================
     抬頭 / 地址
     ======================================================= */

  const infoX =
    80;


  const titleY =
    235;


  /*
    抬頭與地址維持上一版
    約 70px 高度間距。
  */

  const addressY =
    305;


  const title =
    titleEl.value.trim();


  /* =======================================================
     抬頭
     ======================================================= */

  if (title) {

    const titleText =
      "抬頭：" +
      title;


    const titleSize =
      fitText(
        octx,
        titleText,
        1080,
        RECEIPT_FONT_SIZE,
        24
      );


    setReceiptFont(
      octx,
      titleSize
    );


    octx.textAlign =
      "left";

    octx.textBaseline =
      "middle";


    octx.fillText(
      titleText,
      infoX,
      titleY
    );
  }


  /* =======================================================
     地址
     ======================================================= */

  const address =
    addressEl.value.trim();


  const addressText =
    "地址：" +
    address;


  const addressSize =
    fitText(
      octx,
      addressText,
      1080,
      RECEIPT_FONT_SIZE,
      24
    );


  setReceiptFont(
    octx,
    addressSize
  );


  octx.textAlign =
    "left";

  octx.textBaseline =
    "middle";


  octx.fillText(
    addressText,
    infoX,
    addressY
  );


  /* =======================================================
     統一編號 / 單號
     =======================================================

     增加上下間距約 20px：

     統一編號：235
     單   號：305
     ======================================================= */

  const labelX =
    1550;


  const colonX =
    1685;


  const valueX =
    1720;


  const taxY =
    235;


  const orderY =
    305;


  setReceiptFont(
    octx,
    RECEIPT_FONT_SIZE
  );


  octx.textAlign =
    "left";

  octx.textBaseline =
    "middle";


  /* 統一編號 */

  octx.fillText(
    "統一編號",
    labelX,
    taxY
  );


  octx.fillText(
    "：",
    colonX,
    taxY
  );


  octx.fillText(
    taxIdEl.value.trim(),
    valueX,
    taxY
  );


  /* 單號 */

  octx.fillText(
    "單   號",
    labelX,
    orderY
  );


  octx.fillText(
    "：",
    colonX,
    orderY
  );


  octx.fillText(
    orderNoEl.value.trim(),
    valueX,
    orderY
  );


  /* =======================================================
     金額
     ======================================================= */

  const nights =
    Math.max(
      0,
      Number(nightsEl.value) || 0
    );


  const unitPrice =
    Math.max(
      0,
      Number(priceEl.value) || 0
    );


  const subtotal =
    nights *
    unitPrice;


  /* =======================================================
     品名摘要
     ======================================================= */

  const items =
    getItems();


  const stayRange =
    getStayDateRange(
      dateEl.value,
      nights
    );


  /*
    模板共有 5 個品項列。

    最後一列保留給：
    《以下空白》
  */


  const itemCenterX =
    505;


  const nightsCenterX =
    1108;


  const priceCenterX =
    1386;


  const totalRightX =
    1805;


  /*
    5 個品項列中心位置。
  */

  const itemRowYs = [
    564,
    677,
    790,
    903,
    1016
  ];


  /* =======================================================
     每一筆品項
     ======================================================= */

  items.forEach(
    (item, index) => {

      if (
        index >= MAX_ITEMS
      ) {
        return;
      }


      let itemText =
        item;


      /*
        只有住宿費自動加住宿日期。
      */

      if (
        item === "住宿費" &&
        stayRange
      ) {

        itemText =
          `${item} <${stayRange}>`;
      }


      drawCentered(
        octx,
        itemText,
        itemCenterX,
        itemRowYs[index],
        RECEIPT_FONT_SIZE,
        820
      );


      /*
        目前住宿費的天數／單價／總價
        放在第一筆資料列。

        其他品項維持品名摘要，
        不重複計算金額。
      */

      if (
        index === 0
      ) {

        drawCentered(
          octx,
          String(nights),
          nightsCenterX,
          itemRowYs[index],
          RECEIPT_FONT_SIZE,
          180
        );


        drawCentered(
          octx,
          Number(unitPrice).toLocaleString(
            "en-US"
          ),
          priceCenterX,
          itemRowYs[index],
          RECEIPT_FONT_SIZE,
          220
        );


        drawRight(
          octx,
          money(subtotal),
          totalRightX,
          itemRowYs[index],
          RECEIPT_FONT_SIZE
        );
      }

    }
  );


  /* =======================================================
     《以下空白》
     =======================================================

     永遠放在最後一筆品項的下一列。
     ======================================================= */

  const blankRowIndex =
    Math.min(
      items.length,
      MAX_ITEMS
    );


  drawCentered(
    octx,
    "《以下空白》",
    itemCenterX,
    itemRowYs[blankRowIndex],
    RECEIPT_FONT_SIZE,
    820
  );


  /* =======================================================
     小計
     ======================================================= */

  drawRight(
    octx,
    money(subtotal),
    totalRightX,
    1110,
    RECEIPT_FONT_SIZE
  );


  /* =======================================================
     折扣
     ======================================================= */

  drawRight(
    octx,
    "$0",
    totalRightX,
    1225,
    RECEIPT_FONT_SIZE
  );


  /* =======================================================
     總計
     ======================================================= */

  drawRight(
    octx,
    money(subtotal),
    totalRightX,
    1338,
    RECEIPT_FONT_SIZE
  );


  /* =======================================================
     合併透明文字層
     ======================================================= */

  ctx.drawImage(
    overlay,
    0,
    0
  );


  return canvas;
}


/* =========================================================
   預覽
   ========================================================= */

function showPreview() {

  try {

    const canvas =
      buildCanvas();


    lastCanvas =
      canvas;


    previewImg.src =
      canvas.toDataURL(
        "image/png"
      );


    statusEl.textContent =
      "預覽已更新。";


  } catch (error) {

    statusEl.textContent =
      error.message;
  }
}


/* =========================================================
   Canvas → Blob
   ========================================================= */

function blobFromCanvas(
  canvas,
  type,
  quality
) {

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (blob) {

            resolve(blob);

          } else {

            reject(
              new Error(
                "瀏覽器無法產生圖片。"
              )
            );
          }

        },
        type,
        quality
      );

    }
  );
}


/* =========================================================
   PNG ≤ 1 MB
   ========================================================= */

async function makePngUnder1MB() {

  let canvas =
    lastCanvas ||
    buildCanvas();


  let blob =
    await blobFromCanvas(
      canvas,
      "image/png"
    );


  if (
    blob.size <=
    TARGET_MAX_BYTES
  ) {

    return {
      blob,
      scale: 1
    };
  }


  let scale =
    0.95;


  while (
    scale >= 0.40
  ) {

    const c =
      document.createElement(
        "canvas"
      );


    c.width =
      Math.max(
        1,
        Math.round(
          W * scale
        )
      );


    c.height =
      Math.max(
        1,
        Math.round(
          H * scale
        )
      );


    const cx =
      c.getContext(
        "2d"
      );


    cx.drawImage(
      canvas,
      0,
      0,
      c.width,
      c.height
    );


    blob =
      await blobFromCanvas(
        c,
        "image/png"
      );


    if (
      blob.size <=
      TARGET_MAX_BYTES
    ) {

      return {
        blob,
        scale
      };
    }


    scale -=
      0.05;
  }


  throw new Error(
    "PNG 即使縮小後仍無法控制在 1 MB 以下。"
  );
}


/* =========================================================
   JPG ≤ 1 MB
   ========================================================= */

async function makeJpgUnder1MB() {

  const original =
    lastCanvas ||
    buildCanvas();


  let scale =
    1;


  while (
    scale >= 0.40
  ) {

    let canvas =
      original;


    if (
      scale !== 1
    ) {

      canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        Math.max(
          1,
          Math.round(
            W * scale
          )
        );


      canvas.height =
        Math.max(
          1,
          Math.round(
            H * scale
          )
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#fff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        original,
        0,
        0,
        canvas.width,
        canvas.height
      );
    }


    for (
      let quality = 0.92;
      quality >= 0.35;
      quality -= 0.05
    ) {

      const blob =
        await blobFromCanvas(
          canvas,
          "image/jpeg",
          quality
        );


      if (
        blob.size <=
        TARGET_MAX_BYTES
      ) {

        return {
          blob,
          scale,
          quality
        };
      }
    }


    scale -=
      0.05;
  }


  throw new Error(
    "JPG 即使壓縮後仍無法控制在 1 MB 以下。"
  );
}


/* =========================================================
   檔名
   ========================================================= */

function safeFilename(
  ext
) {

  const date =
    (
      dateEl.value ||
      "receipt"
    ).replaceAll(
      "-",
      ""
    );


  const order =
    orderNoEl.value
      .trim()
      .replace(
        /[^a-zA-Z0-9_-]/g,
        ""
      );


  const finalOrder =
    order ||
    "receipt";


  return (
    `沐光民宿二館_${date}_${finalOrder}.${ext}`
  );
}


/* =========================================================
   下載
   ========================================================= */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );
}


/* =========================================================
   PNG / JPG 下載
   ========================================================= */

async function download(
  type
) {

  const pngButton =
    $("downloadPng");

  const jpgButton =
    $("downloadJpg");


  pngButton.disabled =
    true;

  jpgButton.disabled =
    true;


  try {

    statusEl.textContent =
      "正在產生檔案，並控制在 1 MB 以下……";


    lastCanvas =
      buildCanvas();


    let result;


    if (
      type === "png"
    ) {

      result =
        await makePngUnder1MB();

    } else {

      result =
        await makeJpgUnder1MB();
    }


    const sizeMB =
      (
        result.blob.size /
        1024 /
        1024
      ).toFixed(2);


    downloadBlob(
      result.blob,
      safeFilename(type)
    );


    let detail;


    if (
      type === "png"
    ) {

      detail =
        `縮放 ${Math.round(
          result.scale * 100
        )}%`;

    } else {

      detail =
        `縮放 ${Math.round(
          result.scale * 100
        )}%、品質 ${Math.round(
          result.quality * 100
        )}%`;
    }


    statusEl.textContent =
      `完成：${sizeMB} MB（${detail}）。`;


  } catch (error) {

    statusEl.textContent =
      "產生失敗：" +
      error.message;


  } finally {

    pngButton.disabled =
      false;

    jpgButton.disabled =
      false;
  }
}


/* =========================================================
