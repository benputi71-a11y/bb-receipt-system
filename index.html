<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174a8b">
<title>民宿電子收據系統｜沐光民宿二館</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{background:#174a8b;color:white;padding:20px}.wrap{max-width:1100px;margin:auto}
h1{font-size:24px;margin:0 0 6px}header p{margin:0;opacity:.9}
main{padding:18px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
h2{font-size:19px;margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-weight:700;font-size:14px}input{width:100%;margin-top:6px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:15px}button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#174a8b;color:#fff}.secondary{background:#e8eef6;color:#174a8b}
.preview-wrap{overflow:auto;background:#e9edf2;border-radius:12px;padding:10px;text-align:center}
canvas{max-width:100%;height:auto;background:white;box-shadow:0 2px 8px #0002}
.note{background:#f7f9fc;border-left:4px solid #174a8b;padding:12px;line-height:1.65;font-size:14px}
@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.actions{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🏠 民宿電子收據系統</h1><p>第一個可填寫版本｜沐光民宿二館</p></div></header>
<main class="wrap">
<section class="card">
<h2>① 輸入收據資料</h2>
<div class="form">
<label>旅客姓名<input id="guest" value="王小明"></label>
<label>入住日期<input id="date" type="date" value="2024-12-12"></label>
<label>住宿天數<input id="nights" type="number" min="1" value="1"></label>
<label>單價<input id="price" type="number" min="0" value="2000"></label>
<label>抬頭<input id="title" value="臺灣高等法院"></label>
<label>統一編號<input id="tax" value="03796404"></label>
<label>訂單編號<input id="order" value="0afb 867-2"></label>
<label>地址<input id="address" value=""></label>
<label class="full">品名摘要<input id="item" value="沐光 住宿公務保留房費"></label>
</div>
<div class="actions"><button class="primary" onclick="makeReceipt()">產生預覽</button><button class="secondary" onclick="resetForm()">恢復測試資料</button></div>
</section>

<section class="card">
<h2>② 收據預覽</h2>
<div class="note">目前是「第一個自動套版測試版」。原始收據圖片作為底圖，因此灰色「沐光」浮水印會保留。下一階段再加入手寫簽名、JPG 壓縮、五間民宿設定與本機紀錄。</div>
<br>
<div class="preview-wrap"><canvas id="receipt" width="1499" height="1007"></canvas></div>
<div class="actions"><button class="primary" onclick="downloadJpg()">下載 JPG（測試版）</button></div>
</section>
</main>
<script>
const W=1499,H=1007, img=new Image(); img.src="receipt-template-m2.png";
const $=id=>document.getElementById(id);
function rocDate(v){if(!v)return "";const d=new Date(v+"T00:00:00");return `${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`}
function money(n){return Number(n||0).toLocaleString("zh-TW")}
function drawText(ctx,text,x,y,size=28,align="left",weight="400"){ctx.save();ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif`;ctx.fillStyle="#111";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(text,x,y);ctx.restore()}
function cover(ctx,x,y,w,h){ctx.save();ctx.fillStyle="white";ctx.fillRect(x,y,w,h);ctx.restore()}
function makeReceipt(){
 if(!img.complete){img.onload=makeReceipt;return}
 const c=$("receipt"),ctx=c.getContext("2d");ctx.clearRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);
 const guest=$("guest").value.trim(),date=$("date").value,n=Number($("nights").value||1),price=Number($("price").value||0),total=n*price,title=$("title").value.trim(),tax=$("tax").value.trim(),order=$("order").value.trim(),addr=$("address").value.trim(),item=$("item").value.trim();
 // Header fields: cover only the changeable text, not the watermark or stamps.
 cover(ctx,430,108,650,52); drawText(ctx,rocDate(date),755,135,30,"center");
 cover(ctx,230,158,370,55); drawText(ctx,title||" ",415,190,29,"center");
 cover(ctx,885,158,390,55); drawText(ctx,`統一編號： ${tax}`,1080,190,27,"center");
 cover(ctx,75,205,820,55); drawText(ctx,addr?`地址： ${addr}`:"地址：",80,235,27,"left");
 cover(ctx,1040,205,330,55); drawText(ctx,`單　　號： ${order}`,1200,235,27,"center");
 // Main item row. Preserve the original watermark behind it.
 cover(ctx,80,330,440,95); drawText(ctx,`${item}`,300,362,27,"center"); drawText(ctx,`《${date?date.slice(5).replace("-","/"):"" }》`,300,400,25,"center");
 cover(ctx,535,330,160,95); drawText(ctx,String(n),615,378,28,"center");
 cover(ctx,695,330,180,95); drawText(ctx,`$  ${money(price)}`,785,378,27,"center");
 cover(ctx,875,330,205,95); drawText(ctx,`$  ${money(total)}`,980,378,27,"center");
 // Subtotal / total
 cover(ctx,875,746,205,65); drawText(ctx,`$${money(total)}`,980,778,29,"center");
 cover(ctx,875,870,205,65); drawText(ctx,`$${money(total)}`,980,902,29,"center");
 // Add guest name in a clean, non-destructive area near item.
 cover(ctx,80,420,440,48); drawText(ctx,`旅客：${guest}`,300,444,24,"center");
}
function downloadJpg(){
 const c=$("receipt");const a=document.createElement("a");a.download=`沐光民宿二館_${$("guest").value||"旅客"}_收據.jpg`;a.href=c.toDataURL("image/jpeg",.88);a.click();
}
function resetForm(){ $("guest").value="王小明";$("date").value="2024-12-12";$("nights").value=1;$("price").value=2000;$("title").value="臺灣高等法院";$("tax").value="03796404";$("order").value="0afb 867-2";$("address").value="";$("item").value="沐光 住宿公務保留房費";makeReceipt()}
img.onload=makeReceipt;
</script>
</body>
</html>
