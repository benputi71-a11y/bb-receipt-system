<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174a8b">

<title>民宿電子收據系統｜沐光民宿二館</title>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f6fa;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif
}

header{
  background:#174a8b;
  color:white;
  padding:20px
}

  max-width:1100px;
  margin:auto
}

  font-size:24px;

}

  margin:0;
  opacity:.9
}

  padding:18px
}

}

}

  grid-template-columns:repeat(2,1fr);

<body>

<header>
  <div class="wrap">
    <h1>🏠 民宿電子收據系統</h1>
    <p>第一個可填寫版本｜沐光民宿二館</p>
  </div>
</header>


<main class="wrap">

<section class="card">

<h2>① 輸入收據資料</h2>

<div class="form">

<label>
  入住日期
  <input id="date" type="date" value="2024-12-12">
</label>

<label>
  住宿天數
  <input id="nights" type="number" min="1" value="1">
</label>

<label>
  單價
  <input id="price" type="number" min="0" value="2000">
</label>

<label>
  抬頭
  <input id="title" value="臺灣高等法院">
</label>

<label>
  統一編號
  <input id="tax" value="03796404">
</label>

<label>
  訂單編號
  <input id="order" value="0afb 867-2">
</label>

<label>
  地址
  <input id="address" value="">
</label>

<label class="full">
  品名摘要
  <input id="item" value="沐光 住宿公務保留房費">
</label>

</div>

<div class="actions">

<button class="primary" onclick="makeReceipt()">
  產生預覽
</button>

<button class="secondary" onclick="resetForm()">
  恢復測試資料
</button>

</div>

</section>


<section class="card">

<h2>② 收據預覽</h2>

<div class="note">
目前是「第一個自動套版測試版」。
原始收據圖片作為底圖，因此灰色「沐光」浮水印會保留。
下一階段再加入手寫簽名、JPG 壓縮、五間民宿設定與本機紀錄。
</div>

<br>

<div class="preview-wrap">
  <canvas id="receipt" width="1499" height="1007"></canvas>
</div>

<div class="actions">

<button class="primary" onclick="downloadJpg()">
  下載 JPG（測試版）
</button>

</div>

</section>

</main>


<script>

const W=1499;
const H=1007;

const img=new Image();
img.src="receipt-template-m2.png";

const $=id=>document.getElementById(id);


/* 民國日期 */
function rocDate(v){

  if(!v)return "";

  const d=new Date(v+"T00:00:00");

  return `${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
}


/* 金額格式 */
function money(n){

  return Number(n||0).toLocaleString("zh-TW");

}


/* 畫文字 */
function drawText(
  ctx,
  text,
  x,
  y,
  size=28,
  align="left",
  weight="400"
){

  ctx.save();

  ctx.font=
    `${weight} ${size}px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif`;

  ctx.fillStyle="#111";

  ctx.textAlign=align;

  ctx.textBaseline="middle";

  ctx.fillText(text,x,y);

  ctx.restore();

}


/*
  只清除原模板中的文字區域。

  注意：
  這裡使用接近原本底圖的白色區塊，
  不會把 HTML 輸入框的任何背景帶進收據。
*/
function cover(ctx,x,y,w,h){

  ctx.save();

  ctx.fillStyle="#ffffff";

  ctx.fillRect(x,y,w,h);

  ctx.restore();

}


/* 產生收據 */

function makeReceipt(){

  if(!img.complete){

    img.onload=makeReceipt;

    return;

  }


  const c=$("receipt");

  const ctx=c.getContext("2d");


  /* 重新載入原始收據底圖 */

  ctx.clearRect(0,0,W,H);

  ctx.drawImage(img,0,0,W,H);


  /* 取得輸入資料 */

  const date=$("date").value;

  const n=Number($("nights").value||1);

  const price=Number($("price").value||0);

  const total=n*price;

  const title=$("title").value.trim();

  const tax=$("tax").value.trim();

  const order=$("order").value.trim();

  const addr=$("address").value.trim();

  const item=$("item").value.trim();


  /* =========================
     1. 入住日期
     ========================= */

  cover(ctx,430,108,650,52);

  drawText(
    ctx,
    rocDate(date),
    755,
    135,
    30,
    "center"
  );


  /* =========================
     2. 抬頭
     
     有輸入：
     抬頭：臺灣高等法院

     沒輸入：
     完全不顯示
     ========================= */

  cover(ctx,230,158,650,55);

  if(title){

    drawText(
      ctx,
      `抬頭：${title}`,
      235,
      190,
      29,
      "left"
    );

  }


  /* =========================
     3. 統一編號
     ========================= */

  cover(ctx,885,158,390,55);

  drawText(
    ctx,
    `統一編號： ${tax}`,
    890,
    190,
    27,
    "left"
  );


  /* =========================
     4. 地址
     ========================= */

  cover(ctx,75,205,820,55);

  drawText(
    ctx,
    addr ? `地址： ${addr}` : "地址：",
    80,
    235,
    27,
    "left"
  );


  /* =========================
     5. 單號

     把原模板單號文字完整覆蓋，
     然後重新畫一次。

     左側位置與統一編號對齊。
     ========================= */

  cover(ctx,1040,205,330,55);

  drawText(
    ctx,
    `單號： ${order}`,
    1045,
    235,
    27,
    "left"
  );


  /* =========================
     6. 品名摘要
     ========================= */

  cover(ctx,80,330,440,95);

  drawText(
    ctx,
    item,
    300,
    362,
    27,
    "center"
  );

  drawText(
    ctx,
    `《${date ? date.slice(5).replace("-","/") : ""}》`,
    300,
    400,
    25,
    "center"
  );


  /* =========================
     7. 住宿天數
     ========================= */

  cover(ctx,535,330,160,95);

  drawText(
    ctx,
    String(n),
    615,
    378,
    28,
    "center"
  );


  /* =========================
     8. 單價
     ========================= */

  cover(ctx,695,330,180,95);

  drawText(
    ctx,
    `$ ${money(price)}`,
    785,
    378,
    27,
    "center"
  );


  /* =========================
     9. 小計
     ========================= */

  cover(ctx,875,330,205,95);

  drawText(
    ctx,
    `$ ${money(total)}`,
    980,
    378,
    27,
    "center"
  );


  /* =========================
     10. 小計金額
     ========================= */

  cover(ctx,875,746,205,65);

  drawText(
    ctx,
    `$${money(total)}`,
    980,
    778,
    29,
    "center"
  );


  /* =========================
     11. 總計金額
     ========================= */

  cover(ctx,875,870,205,65);

  drawText(
    ctx,
    `$${money(total)}`,
    980,
    902,
    29,
    "center"
  );


}


/* 下載 JPG */

function downloadJpg(){

  const c=$("receipt");

  const a=document.createElement("a");

  a.download=
    `沐光民宿二館_收據.jpg`;

  a.href=
    c.toDataURL("image/jpeg",.88);

  a.click();

}


/* 恢復測試資料 */

function resetForm(){

  $("date").value="2024-12-12";

  $("nights").value=1;

  $("price").value=2000;

  $("title").value="臺灣高等法院";

  $("tax").value="03796404";

  $("order").value="0afb 867-2";

  $("address").value="";

  $("item").value="沐光 住宿公務保留房費";

  makeReceipt();

}


/* 初始載入 */

img.onload=makeReceipt;

</script>

</body>

</html>
